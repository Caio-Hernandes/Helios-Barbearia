# Serve o build do React (SPA) e repassa /api para o backend.
# Navegador e API ficam na mesma origem: sem CORS, e o cookie de refresh
# (Path=/api/auth) é enviado normalmente.
#
# Cabeçalhos de segurança: os arquivos estáticos recebem os do nginx; as
# respostas da API já trazem os do helmet (Express), então não são duplicados.
# Obs.: um add_header dentro de um location anula os do nível de cima, por isso
# cada location estático repete os seus.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API: /api/auth/login -> http://api:3333/auth/login
    location /api/ {
        proxy_pass http://api:3333/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Arquivos com hash no nome (gerados pelo Vite): cache longo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html nunca em cache, para o navegador pegar a versão nova após um deploy
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Demais arquivos e rotas do React Router (/agenda, /painel...), que caem no index.html
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
